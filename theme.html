<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Theme Room</title>
  </head>
  <body>
    <main class="room">
      <header class="room-header">
        <h1>Theme room</h1>
        <p class="room-intro">
          Theme loops from <code>music/</code>. Pick a track to start; pick another to crossfade.
          The switch waits for the next bar, enters the new loop at the same beat, and glides the
          tempo like a tape machine so both stay in step through the fade.
        </p>
        <div class="room-controls">
          <button type="button" id="stop">Stop</button>
          <label>
            Volume
            <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" />
          </label>
          <label>
            Crossfade <output id="fade-value">4 s</output>
            <input id="fade" type="range" min="0.5" max="12" step="0.5" value="4" />
          </label>
          <label class="check">
            <input id="on-bar" type="checkbox" checked />
            Switch on the next bar
          </label>
          <label class="check">
            <input id="click" type="checkbox" />
            Beat click
          </label>
        </div>
        <p class="status" id="status">Stopped.</p>
        <div class="beat" id="beat" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
      </header>
      <section id="groups"></section>
    </main>
    <script type="module" src="/src/theme-room/main.ts"></script>
  </body>
</html>
