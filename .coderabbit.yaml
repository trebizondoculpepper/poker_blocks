# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review configuration. The project's core rule is composition:
# no special-case branching. See AGENTS.md, "No special cases".
language: en-GB
reviews:
  profile: assertive
  # Findings are comments; blocking comes from the CodeRabbit check on the current commit
  # (a required status check on main), so a stale review never holds a PR.
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  pre_merge_checks:
    override_requested_reviewers_only: true
    description:
      mode: warning
    custom_checks:
      - name: "No special-case branching"
        mode: error
        instructions: |
          Pass/fail criteria. FAIL if the diff ADDS (not merely moves or deletes) any of:
          1. A comparison of a phase, scene, room, mode, screen, material, kind, type,
             dealer, name or id against a literal, e.g. `game.phase === "shop"`,
             `kind === "steel"`, `room.id === "dev3"`, or the reverse order.
          2. A `switch` over any of those values.
          3. A trait read as a flag: `if (traits.x)`, `if (!roomTraits.x)`,
             `roomTraits.x ? a : b`, `traits.x && doSomething()`. A trait must carry its
             behaviour (lifecycle hooks or a registry of handlers), not be checked.
          4. A check of whether a mode is a developer one (`.dev`).
          5. New game logic in `src/main.ts` (rules, scoring, phase or scene decisions,
             per-mode behaviour). main.ts may only construct services, the scene manager
             and the run controller.
          6. Any new line in `src/guardrails-baseline.json` (entries may only be removed, or
             moved verbatim together with their code).
          7. A mode's or scene's identity used to choose behaviour in ANY spelling, not only
             `===`: a membership test (`["dev3"].includes(mode.id)`, `ids.has(scene.id)`),
             a table or map indexed by it (`{ dev3: 2 }[mode.id]`, `bonuses[mode.id]`), a
             helper that hides the check (`isShopScene(id)`), or naming a specific mode
             anywhere outside `src/game-modes.ts`. Identity is opaque: ids may be used to
             look things up in their registry, build save keys, URLs and scene ids, or for
             display, never to select behaviour.
          8. A side table or set keyed by a kind, phase, scene, screen or material
             (`edgeColours[material]`, `labels[phase]`, `transparent.has(kind)`): the same
             special case written as data. That data belongs on the thing's definition, as
             trait configuration.
          General test: if adding a new mode, scene or material would require editing this
          code (adding an id to a list, a key to a table, a case to a branch), it is a
          special case, whatever its syntax. Registries keyed by trait or step name are fine.
          Exceptions: a line ending in `// branch-ok: #<issue>` passes only if the linked
          issue states why the branch is necessary. Validating untrusted input (e.g. parsing
          a save file, `typeof x === "string"`) and tests are not special cases.
          PASS otherwise. When failing, name each offending line and suggest the trait,
          registry entry or configuration that should own the behaviour instead.
      - name: "Architecturally correct"
        mode: error
        instructions: |
          Pass/fail criteria. Judge whether the change fits the architecture in
          doc/game-architecture.md (especially "Agreed principles" and "Modes, scenes and
          traits") and AGENTS.md. Do not only check the diff compiles; ask where the
          behaviour lives and whether that is the right place. FAIL if any of:
          1. Behaviour is put in the wrong layer: game rules outside GameRun, run setup or a
             trait; rendering or DOM work inside GameRun or rules code; scene sequencing
             hard-coded rather than expressed as game-flow data on the game mode.
          2. A block, scene or mode gains behaviour code of its own instead of composing a
             reusable, configured trait (definitions must stay plain, serialisable data).
          3. A trait is used only as a flag that other code checks, rather than carrying its
             behaviour through lifecycle hooks (enter/exit/update/handles) or a registry.
          4. A new mechanism duplicates an existing one (a second registry, event channel,
             settings store, save path or scene/overlay system) instead of extending it.
          5. A module reaches into another's internals or shared mutable module state where
             a service interface or event should be used; new coupling to src/main.ts.
          8. Identity used as behaviour: a mode or scene id (or a kind, phase or material)
             used as a key into code or data that lives outside that thing's definition.
          6. The change contradicts the documented design without updating the docs in the
             same PR, or adds a concept (new kind of scene, trait family, save field) that
             the docs do not describe.
          7. A save-format change lacks a version bump and an explicit migration.
          PASS otherwise. When failing, explain which principle is broken, cite the doc
          section, and propose the architecturally correct shape (which trait, service,
          registry or scene should own it).
      - name: "Consistent with documented decisions"
        mode: error
        instructions: |
          Pass/fail criteria. The project records its earlier decisions in two documents,
          and every change must be checked against both:
          - doc/game-architecture.md decides HOW things are implemented (composition,
            traits, scenes, modes, registries, events, saving, layering).
          - doc/game.md decides WHAT the game is: its rules (scoring, hands, lines, stages,
            rounds, shop, passives, coins, materials, win and loss conditions).
          Read the relevant sections of both before judging. FAIL if the change:
          1. Implements something in a way that contradicts a decision in
             doc/game-architecture.md (cite the section and quote the decision).
          2. Changes game behaviour so it no longer matches doc/game.md: different
             scoring, limits, prices, rewards, ordering, or a rule the document does not
             describe (cite the section and quote the rule).
          3. Changes either decision deliberately but does not update the document in the
             same PR. Changing a decision is allowed; doing it silently is not.
          4. Adds a new mechanic or architectural concept that neither document mentions,
             without adding it to the right document.
          PASS when the code and both documents agree after the PR. When failing, list each
          conflict as: the decision (file, section, quote), what the change does instead,
          and whether the code or the document should change.
      - name: "Baseline only shrinks"
        mode: error
        instructions: |
          Pass/fail criteria. `src/guardrails-baseline.json` lists each legacy offending
          line verbatim. If it changes, lines may only be removed, or moved verbatim to
          another file together with the code that moved. FAIL on any new line, any edited
          line text that is not a pure move, or a new file entry not explained by a move.
  path_instructions:
    - path: "src/main.ts"
      instructions: |
        main.ts is the composition root (wiring only). Flag any added conditional that
        depends on game state, phase, scene, mode or a trait's presence, any mode or scene
        named here, and any added game rule. Request that it move into a trait, a scene's
        traits, a service or the run controller.
    - path: "src/**/*.ts"
      instructions: |
        Review against the project's recorded decisions first, correctness second:
        doc/game-architecture.md (how we implement) and doc/game.md (the game's rules).
        Flag any conflict with an earlier decision, citing the section, and say whether
        the code or the document should change.
        Enforce AGENTS.md "No special cases": behaviour comes from composed traits, never
        from branching on what kind of thing something is. A registry of handlers keyed by
        TRAIT or STEP NAME is the right shape; a table keyed by a mode, scene, phase or
        material id is a special case in disguise. Identity is opaque: flag any mode or
        scene id used to SELECT BEHAVIOUR (a comparison, `includes`/`has`/`get` on a
        hand-written list, set, map or object, a table index, or a helper that hides such
        a check), and any mode named outside src/game-modes.ts. Resolving the handle
        through its registry (`gameModeRegistry.get(id)`, `sceneRegistry.has(id)` to
        validate) is the permitted use and is not a finding. Flag trait
        presence checks used as flags (`if`, `?:`, `&&`). Ask for tests for new traits.
    - path: "src/game-modes.ts"
      instructions: |
        Game modes and their scenes must be plain data: ids, trait configurations and run
        setup steps. This is the only file that may name a specific mode. Flag any function
        here that branches on phase, mode or scene ids.
    - path: "doc/**"
      instructions: |
        Docs must stay consistent with AGENTS.md "No special cases" and the "Modes, scenes
        and traits" section of doc/game-architecture.md. Flag docs that describe new
        behaviour as a special case rather than a trait.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "doc/game-architecture.md"
      - "doc/game.md"
      - "doc/game-events.md"
      - "doc/passives.md"
      - "doc/terms.md"
