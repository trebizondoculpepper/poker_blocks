<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Music Room</title>
  </head>
  <body>
    <main class="room">
      <header class="room-header">
        <h1>Music room</h1>
        <p class="room-intro">
          Loops from <code>music/loops/</code>. Click a loop: on the next bar it fades in
          (logarithmically) on the same beat, at the current tempo; the old loop stops once the fade
          completes, then the tempo eases to the new loop's own speed like a tape machine.
        </p>
        <div class="room-controls">
          <button type="button" id="stop">Stop</button>
          <label>
            Volume
            <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" />
          </label>
          <label>
            Crossfade <output id="fade-value">4 s</output>
            <input id="fade" type="range" min="0.5" max="12" step="0.5" value="4" />
          </label>
          <label>
            Tempo ease <output id="ease-value">5 s</output>
            <input id="ease" type="range" min="0" max="15" step="0.5" value="5" />
          </label>
          <label class="check">
            <input id="click" type="checkbox" />
            Beat click
          </label>
        </div>
        <p class="status" id="status">Stopped.</p>
        <div class="beat" id="beat" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
      </header>
      <section id="groups"></section>
    </main>
    <script type="module" src="/src/music-room/main.ts"></script>
  </body>
</html>
