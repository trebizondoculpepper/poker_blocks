name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: the build's version counts the commits since the last release (#128).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      # Only a release commit may change the version (scripts/version-guard.ts).
      - name: Version guard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/version-guard.ts "origin/${{ github.base_ref }}" HEAD
          else
            node scripts/version-guard.ts "${{ github.event.before }}" "${{ github.sha }}"
          fi
      - run: vp check
      - run: vp test run --passWithNoTests
      - run: vp build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
